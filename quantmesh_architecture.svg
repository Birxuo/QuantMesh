<svg width="1000" height="600" viewBox="0 0 1000 600" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="1000" height="600" fill="#0A0F1E"/>
  
  <!-- Grid Pattern -->
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#ffffff05" stroke-width="1"/>
    </pattern>
    <linearGradient id="boxGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ffffff08;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#ffffff02;stop-opacity:1" />
    </linearGradient>
  </defs>
  <rect width="1000" height="600" fill="url(#grid)" />

  <!-- Zones -->
  <text x="150" y="50" fill="#64748B" font-family="Inter, sans-serif" font-size="12" font-weight="600">CONSUMER AGENT ENVIRONMENT</text>
  <text x="700" y="50" fill="#64748B" font-family="Inter, sans-serif" font-size="12" font-weight="600">PROVIDER INFRASTRUCTURE</text>

  <!-- Consumer Box -->
  <rect x="50" y="70" width="300" height="400" rx="12" fill="url(#boxGrad)" stroke="#3B82F644" stroke-width="1.5"/>
  <text x="70" y="105" fill="#3B82F6" font-family="Inter, sans-serif" font-size="16" font-weight="700">Autonomous Agent</text>
  <rect x="70" y="130" width="260" height="60" rx="8" fill="#ffffff05" stroke="#ffffff11"/>
  <text x="85" y="155" fill="#CBD5E1" font-family="Inter, sans-serif" font-size="13">Strategy Engine</text>
  <text x="85" y="175" fill="#64748B" font-family="Inter, sans-serif" font-size="11">Signal Catalog Analysis loop</text>
  
  <rect x="70" y="210" width="260" height="60" rx="8" fill="#ffffff05" stroke="#ffffff11"/>
  <text x="85" y="235" fill="#CBD5E1" font-family="Inter, sans-serif" font-size="13">EIP-3009 Signer</text>
  <text x="85" y="255" fill="#64748B" font-family="Inter, sans-serif" font-size="11">Off-chain USDC Authorization</text>

  <rect x="70" y="290" width="260" height="60" rx="8" fill="#22C55E11" stroke="#22C55E44"/>
  <text x="85" y="315" fill="#4ADE80" font-family="Inter, sans-serif" font-size="13">x402 HTTP Client</text>
  <text x="85" y="335" fill="#64748B" font-family="Inter, sans-serif" font-size="11">Auto-handles 402 → Payment</text>

  <!-- Provider Box -->
  <rect x="650" y="70" width="300" height="400" rx="12" fill="url(#boxGrad)" stroke="#8B5CF644" stroke-width="1.5"/>
  <text x="670" y="105" fill="#8B5CF6" font-family="Inter, sans-serif" font-size="16" font-weight="700">QuantMesh Server</text>
  
  <rect x="670" y="130" width="260" height="60" rx="8" fill="#F59E0B11" stroke="#F59E0B44"/>
  <text x="685" y="155" fill="#FBBF24" font-family="Inter, sans-serif" font-size="13">x402 Middleware</text>
  <text x="685" y="175" fill="#64748B" font-family="Inter, sans-serif" font-size="11">Auth Verification & Settlement</text>

  <rect x="670" y="210" width="260" height="60" rx="8" fill="#ffffff05" stroke="#ffffff11"/>
  <text x="685" y="235" fill="#CBD5E1" font-family="Inter, sans-serif" font-size="13">FastAPI Signal Engine</text>
  <text x="685" y="255" fill="#64748B" font-family="Inter, sans-serif" font-size="11">yfinance + Quant Models</text>

  <rect x="670" y="290" width="260" height="60" rx="8" fill="#ffffff05" stroke="#ffffff11"/>
  <text x="685" y="315" fill="#CBD5E1" font-family="Inter, sans-serif" font-size="13">SQLite Transaction Ledger</text>
  <text x="685" y="335" fill="#64748B" font-family="Inter, sans-serif" font-size="11">Permanent Settlement Log</text>

  <rect x="670" y="370" width="260" height="50" rx="8" fill="#ffffff05" stroke="#ffffff11"/>
  <text x="685" y="400" fill="#CBD5E1" font-family="Inter, sans-serif" font-size="13">WebSocket Broadcaster</text>

  <!-- Settlement Zone -->
  <rect x="350" y="480" width="300" height="100" rx="12" fill="#22C55E08" stroke="#22C55E44" stroke-dasharray="4 4"/>
  <text x="440" y="510" fill="#4ADE80" font-family="Inter, sans-serif" font-size="14" font-weight="700">ON-CHAIN SETTLEMENT</text>
  <text x="405" y="535" fill="#CBD5E1" font-family="Inter, sans-serif" font-size="12">Circle USDC · Arc (Base Sepolia)</text>
  <text x="435" y="555" fill="#64748B" font-family="Inter, sans-serif" font-size="11">transferWithAuthorization</text>

  <!-- Connections -->
  <path d="M 350 160 L 650 160" stroke="#CBD5E1" stroke-width="1.5" stroke-dasharray="5 5" opacity="0.3"/>
  <text x="420" y="150" fill="#64748B" font-family="Inter, sans-serif" font-size="11" text-anchor="middle">1. Request (momentum)</text>

  <path d="M 650 200 L 350 200" stroke="#F59E0B" stroke-width="1.5" opacity="0.6"/>
  <circle cx="350" cy="200" r="3" fill="#F59E0B"/>
  <text x="500" y="190" fill="#F59E0B" font-family="Inter, sans-serif" font-size="11" text-anchor="middle">2. HTTP 402 Challenge</text>

  <path d="M 350 320 L 650 320" stroke="#22C55E" stroke-width="1.5"/>
  <circle cx="650" cy="320" r="3" fill="#22C55E"/>
  <text x="500" y="310" fill="#22C55E" font-family="Inter, sans-serif" font-size="11" text-anchor="middle">3. Signed x-payment header</text>
  
  <path d="M 500 320 L 500 480" stroke="#22C55E" stroke-width="1.5" stroke-dasharray="2 2"/>
  <text x="510" y="440" fill="#22C55E" font-family="Inter, sans-serif" font-size="10">Settlement</text>

  <path d="M 650 400 L 350 400" stroke="#3B82F6" stroke-width="1.5" stroke-dasharray="5 5"/>
  <text x="500" y="390" fill="#3B82F6" font-family="Inter, sans-serif" font-size="11" text-anchor="middle">4. Payload + Verified tx_hash</text>

  <!-- Dashboard -->
  <rect x="700" y="500" width="200" height="60" rx="8" fill="#ffffff05" stroke="#ffffff11"/>
  <text x="735" y="535" fill="#CBD5E1" font-family="Inter, sans-serif" font-size="13" font-weight="600">LIVE DASHBOARD</text>
  <path d="M 800 420 L 800 500" stroke="#CBD5E1" stroke-width="1" stroke-dasharray="3 3"/>
  <text x="810" y="470" fill="#64748B" font-family="Inter, sans-serif" font-size="10">WebSocket</text>

</svg>